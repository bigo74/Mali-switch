<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALİ-SWITCH Tasarım Ekranı</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; text-align: center; }
        .container { background-color: #1e1e1e; max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0px 0px 20px rgba(0,255,204,0.3); text-align: left; }
        h1, h2 { color: #00ffcc; text-align: center; }
        #ozelSelamlama { text-align: center; color: #121212; font-weight: bold; font-size: 1.2rem; margin-bottom: 20px; background: #00ffcc; padding: 8px; border-radius: 5px; display: none; box-shadow: 0px 0px 10px rgba(0,255,204,0.5); }
        .section { margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        select, input[type="number"], input[type="text"], input[type="tel"] { width: 100%; padding: 10px; background-color: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; box-sizing: border-box; }
        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .checkbox-group label { display: flex; align-items: center; background: #2a2a2a; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; border: 1px solid #444; }
        .checkbox-group input { margin-right: 10px; }
        .total-box { background-color: #00ffcc; color: #121212; padding: 20px; border-radius: 10px; text-align: center; font-size: 1.5rem; font-weight: bold; margin-top: 20px; }
        .btn { background-color: #ffffff; color: #121212; border: none; padding: 12px 25px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; margin-top: 15px; transition: 0.3s; }
        .btn:hover { background-color: #00ffcc; }
    </style>
</head>
<body>
    <h1>🎮 MALİ-SWITCH</h1>
    <h2>Kendi Konsolunu Tasarla</h2>
    <div id="ozelSelamlama"></div>

    <div class="container">
        <form id="konsolForm" oninput="hesaplaTotal()">
            <div class="section">
                <label>1. Konsolun Beynini Seçin:</label>
                <select id="beyin" required>
                    <option value="320">ESP32 Mikroişlemci (320 TL)</option>
                    <option value="450">Raspberry Pi Pico W (450 TL)</option>
                    <option value="3450">Raspberry Pi 4 Canavar (3450 TL)</option>
                </select>
            </div>

            <div class="section">
                <label>2. Donanım Yapısı Seçin:</label>
                <select id="lehimDurumu" required>
                    <option value="200">Lehimli Hazır Kurulum (+200 TL)</option>
                    <option value="70">Lehimsiz Demonte Paket (+70 TL)</option>
                </select>
            </div>

            <div class="section">
                <label>3. Ekran Büyüklüğü ve Özelliği:</label>
                <select id="ekran" required>
                    <option value="500">5.0 İnç Standart Ekran (+500 TL)</option>
                    <option value="850">5.0 İnç Dokunmatik Ekran (+850 TL)</option>
                    <option value="900">7.0 İnç Dev Ekran (+900 TL)</option>
                    <option value="1350">7.0 İnç Dev Dokunmatik Ekran (+1350 TL)</option>
                </select>
            </div>

            <div class="section">
                <label>4. SD Kart Hafıza Boyutu:</label>
                <select id="sdKart" required>
                    <option value="80">32 GB Micro SD Kart (+80 TL)</option>
                    <option value="130">64 GB Micro SD Kart (+130 TL)</option>
                    <option value="220">128 GB Hızlı SD Kart (+220 TL)</option>
                    <option value="400">256 GB Canavar SD Kart (+400 TL)</option>
                </select>
            </div>

            <div class="section">
                <label>5. Ekstra Garanti Süresi:</label>
                <select id="garanti" required>
                    <option value="0">Garanti İstemiyorum (0 TL)</option>
                    <option value="150">1 Yıl Ek Garanti (+150 TL)</option>
                    <option value="250">2 Yıl Ek Garanti (+250 TL)</option>
                    <option value="400">3 Yıl Ek Garanti (+400 TL)</option>
                </select>
            </div>

            <div class="section checkbox-group">
                <label style="display:block; margin-bottom:5px;">6. Konsolda Oynamak İstediğiniz Oyun Türleri:</label>
                <div class="checkbox-grid">
                    <label><input type="checkbox" name="tur" value="yaris"> Yarış</label>
                    <label><input type="checkbox" name="tur" value="acikdunya"> Açık Dünya</label>
                    <label><input type="checkbox" name="tur" value="arackullanma"> Araç Kullanma</label>
                    <label><input type="checkbox" name="tur" value="cokoyunculu"> Çok Oyuncu</label>
                    <label><input type="checkbox" name="tur" value="otomobil"> Otomobil Sim.</label>
                    <label><input type="checkbox" name="tur" value="simulasyon"> Simülasyon</label>
                    <label><input type="checkbox" name="tur" value="kesif"> Keşif</label>
                    <label><input type="checkbox" name="tur" value="gercekci"> Gerçekçi</label>
                    <label><input type="checkbox" name="tur" value="pvp"> PvP</label>
                    <label><input type="checkbox" name="tur" value="komik"> Komik / Sandbox</label>
                </div>
            </div>

            <div class="section">
                <label>7. Teslimat Bilgileri:</label>
                <input type="text" placeholder="Ad Soyad" required style="margin-bottom: 10px;">
                <input type="tel" placeholder="Telefon (05xx...)" required style="margin-bottom: 10px;">
                <input type="text" placeholder="Adres" required>
            </div>

            <div class="total-box">TOTAL TUTAR: <span id="totalFiyat">0</span> TL</div>
            <button type="submit" class="btn" onclick="alert('Siparişiniz alındı knk!')">Siparişi Tamamla</button>
        </form>
    </div>

    <script>
        window.onload = function() {
            let yazi = prompt("Konsol açılış ekranında hangi yazı çıksın knk?");
            if(yazi) {
                let kutu = document.getElementById('ozelSelamlama');
                kutu.innerText = "AÇILIŞ YAZISI: " + yazi.toUpperCase();
                kutu.style.display = "block";
            }
            hesaplaTotal();
        };
        function hesaplaTotal() {
            let beyinFiyat = parseFloat(document.getElementById('beyin').value) || 0;
            let lehimFiyat = parseFloat(document.getElementById('lehimDurumu').value) || 0;
            let ekranFiyat = parseFloat(document.getElementById('ekran').value) || 0;
            let sdFiyat = parseFloat(document.getElementById('sdKart').value) || 0;
            let garantiFiyat = parseFloat(document.getElementById('garanti').value) || 0;
            
            let total = beyinFiyat + lehimFiyat + ekranFiyat + sdFiyat + garantiFiyat;
            document.getElementById('totalFiyat').innerText = total.toFixed(1);
        }
    </script>
</body>
</html>
